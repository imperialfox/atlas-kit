<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add an item, Save first (a stand-in prototype)</title>
<!-- A stand-in for a Prototype kit page, for the Atlas kit's tests: the kit's screen element is .kit-screen. -->
<style>body{margin:0;font:17px/1.35 -apple-system,system-ui,sans-serif}
.kit-screen{position:relative;width:402px;height:874px;background:#f2f2f7;overflow:hidden}
h1{font-size:34px;margin:0;padding:64px 16px 0}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end}
.sheet{background:#fff;width:100%;border-radius:16px 16px 0 0;padding:20px 16px 32px;box-sizing:border-box}
.sheet h2{margin:0 0 12px;font-size:20px}
.save{height:50px;border-radius:12px;background:#0a7cff;color:#fff;display:grid;place-items:center;font-weight:600}
.fld{height:44px;border-radius:10px;border:1px solid #d8d8dc;margin-top:12px}</style></head>
<body><div class="kit-screen"><h1 data-name="Title">Home</h1>
<div class="scrim"><div class="sheet" data-name="Sheet"><h2>Add an item</h2><div class="save" data-name="save-button">Save</div><div class="fld" data-name="title-field"></div></div></div></div>
</body></html>
